name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & Test (macOS 14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package .app
        run: ./make_app.sh

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileDrawer.app
          path: build/FileDrawer.app
