name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & Test (macOS 14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package .app (universal)
        run: zsh ./make_app.sh --universal

      - name: Zip app
        run: ditto -c -k --keepParent build/FileDrawer.app build/FileDrawer.zip

      - name: Build DMG
        run: zsh ./make_dmg.sh --universal

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileDrawer-universal.zip
          path: build/FileDrawer.zip

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileDrawer-universal.dmg
          path: build/*.dmg
