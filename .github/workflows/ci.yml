name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (macOS 14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: swift build

      - name: Zero-warning gate (release)
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee /tmp/release-build.log
          if grep -q "warning:" /tmp/release-build.log; then
            echo "::error::Release build has compiler warnings (zero-warning gate failed)"
            grep -n "warning:" /tmp/release-build.log || true
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Package .app (universal)
        run: zsh ./make_app.sh --universal

      - name: Zip app
        run: ditto -c -k --keepParent build/FileDrawer.app build/FileDrawer.zip

      - name: Build DMG
        run: zsh ./make_dmg.sh --universal

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileDrawer-universal.zip
          path: build/FileDrawer.zip

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileDrawer-universal.dmg
          path: build/*.dmg

  # 自动化接口端到端冒烟：手动触发（Actions → CI → Run workflow）。
  # 脚本自带保护：FileDrawer 运行中拒绝、defaults 域非空拒绝、结束自清理。
  automation-smoke:
    name: Automation URL Smoke (manual)
    runs-on: macos-14
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Package .app
        run: zsh ./make_app.sh

      - name: Run automation smoke
        run: |
          chmod +x scripts/smoke_automation.sh
          ./scripts/smoke_automation.sh
