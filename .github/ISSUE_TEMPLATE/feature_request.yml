name: 💡 功能建议
description: 新功能、交互改进、自动化接口扩展
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢提议！提之前请先看 README「设计」一节——本项目视觉与交互上刻意克制，
        「少而精」是明确取向，被拒不代表建议不好。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述场景而非方案，例如「经常要把同一批文件发给两个人，每次都要重新拖」
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你设想中的交互 / 行为；有参考的同类软件也可说明
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或临时绕法
    validations:
      required: false
  - type: checkboxes
    id: automation
    attributes:
      label: 是否涉及自动化接口（filedrawer:// URL / Shortcuts）
      description: 涉及的话请在「期望的方案」里写清期望的参数与返回
      options:
        - label: 涉及
        - label: 不涉及
